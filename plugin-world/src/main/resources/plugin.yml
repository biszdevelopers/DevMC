name: "world"
version: "26.2"
main: dev.bisz.world.WorldPlugin
api-version: '1.20'
authors: ["Intestide"]
depend: [Bundler, Currency]
softdepend: [WorldEdit]
permissions:
  world.admin:
    description: Manage settlements, regions, plots, monuments, and the economy.
    default: op
  world.use:
    description: Use settlement and plot player commands.
    default: true
  world.vendor:
    description: Use the system vendor.
    default: true
